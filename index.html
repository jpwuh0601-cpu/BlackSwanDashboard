<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>金融監測中心</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>市場即時監測</h1>
        <button onclick="updateAllData()" class="btn-refresh">🔄 強制更新數據</button>
    </header>

    <main class="grid" id="data-container">
        <div class="card"><h3>台股加權 (TWSE)</h3><p class="val" id="TWSE">...</p></div>
        <div class="card"><h3>美元指數 (DXY)</h3><p class="val" id="DXY">...</p></div>
        <div class="card"><h3>黃金 (GOLD)</h3><p class="val" id="GOLD">...</p></div>
        <div class="card"><h3>道瓊工業 (DJI)</h3><p class="val" id="DJI">...</p></div>
    </main>

    <section class="news-section">
        <h3>宏觀趨勢分析</h3>
        <div id="news-list">
            <p>1. <strong>美伊戰爭</strong>：美伊軍事對峙導致波斯灣局勢緊張，推升原油期貨價格至高點。</p>
            <p>2. <strong>俄烏戰爭</strong>：烏克蘭軍方攻擊俄能源設施，引發全球能源供應鏈恐慌。</p>
            <p>3. <strong>聯準會</strong>：聯準會主席鮑爾發言暗示利率維持高檔，美元指數保持強勢。</p>
            <p>4. <strong>科技動能</strong>：高效能晶片庫存調整週期延長，科技股短期波動加劇。</p>
            <p>5. <strong>貿易壁壘</strong>：歐盟關稅新制導致亞洲零組件供應鏈出口成本增加。</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
